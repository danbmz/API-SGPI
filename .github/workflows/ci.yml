name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
      DATABASE_SSL: "false"
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: secreto-de-ci-cualquier-cosa-larga-123456
      COOKIE_SECRET: otro-secreto-de-ci-diferente-789012

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el cliente de Prisma
        run: npx prisma generate

      - name: Compilar (verifica tipos)
        run: npm run build

      - name: Aplicar migraciones a la base de pruebas
        run: npx prisma migrate deploy

      - name: Sembrar datos base
        run: npx prisma db seed

      - name: Correr los tests
        run: npm test